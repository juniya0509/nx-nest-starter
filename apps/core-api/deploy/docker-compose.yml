# ECR image 를 컨테이너로 실행.
# 변수(IMAGE_URI / NODE_ENV) 는 execute.sh 가 .codedeploy-env 에서 source 한 후 export 한 값을 사용한다.

services:
  core-api:
    image: ${IMAGE_URI}
    container_name: core-api
    restart: always
    env_file:
      - ./.env
    environment:
      - TZ=Asia/Seoul
      - NODE_ENV=${NODE_ENV}
    ports:
      - '3000:3000'
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
