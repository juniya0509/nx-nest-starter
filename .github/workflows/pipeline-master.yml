name: Pipeline (master) — CI + CD

# ────────────────────────────────────────────────────────────
# 트리거 : pull_request (develop → master) + push to master
# 환경   : production (GitHub Environment, production secret / 인프라 자원)
# 동작   :
#   1) PR 단계 (pull_request) — ci job 만 동작, production secret 으로 final 검증
#   2) push 단계 (머지 후)     — ci + deploy-<app> jobs (nx affected 기반)
#                               · PR 시엔 deploy skip
#                               · push 시에만 affected 앱 production 배포
# 상세   : .claude/docs/CD.md
# ────────────────────────────────────────────────────────────

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: pipeline-master-${{ github.ref }}
  cancel-in-progress: false # 프로덕션 검증은 누적 — cancel 하지 않는다

permissions:
  id-token: write # AWS OIDC
  contents: read
  actions: read # nrwl/nx-set-shas — last successful workflow run sha 조회

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    outputs:
      affected_admin: ${{ steps.affected.outputs.admin }}
      affected_core: ${{ steps.affected.outputs.core }}
      affected_batch: ${{ steps.affected.outputs.batch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Derive base/head SHAs for nx affected
        uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: master

      - name: Decode app .env.production files (base64 secrets → apps/<app>/.env.production)
        env:
          ADMIN_ENV_BASE64: ${{ secrets.ADMIN_API_ENV_BASE64 }}
          CORE_ENV_BASE64: ${{ secrets.CORE_API_ENV_BASE64 }}
          BATCH_ENV_BASE64: ${{ secrets.BATCH_ENV_BASE64 }}
        run: |
          echo "$ADMIN_ENV_BASE64" | base64 -d > apps/admin-api/.env.production
          echo "$CORE_ENV_BASE64" | base64 -d > apps/core-api/.env.production
          echo "$BATCH_ENV_BASE64" | base64 -d > apps/batch/.env.production

      - name: Download i18n translations (Lokalise)
        env:
          NODE_ENV: production
        run: |
          pnpm admin i18n:download
          pnpm core i18n:download

      - name: Lint (all)
        run: pnpm nx run-many --target=lint --projects=admin-api,core-api,batch,core-domain,core-enum,core-database,core-contract,core-util --parallel=3

      - name: Unit test (all)
        run: pnpm nx run-many --target=test --projects=admin-api,core-api,batch,core-domain --skip-nx-cache --parallel=1

      - name: Build (all, production config)
        run: pnpm nx run-many --target=build --projects=admin-api,core-api,batch -c=production --parallel=2

      - name: E2E — admin-api
        run: pnpm admin test:e2e

      - name: E2E — core-api
        run: pnpm core test:e2e

      - name: E2E — batch
        run: pnpm batch test:e2e

      - name: Compute affected apps
        id: affected
        run: |
          AFFECTED=$(pnpm exec nx show projects --affected --json)
          echo "Affected: $AFFECTED"
          echo "admin=$(echo "$AFFECTED" | grep -q '"admin-api"' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "core=$(echo "$AFFECTED" | grep -q '"core-api"' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "batch=$(echo "$AFFECTED" | grep -q '"batch"' && echo true || echo false)" >> "$GITHUB_OUTPUT"

  # PR 단계에선 deploy 안 함 — push 이벤트일 때만 affected 앱 배포
  deploy-admin-api:
    needs: ci
    if: github.event_name == 'push' && needs.ci.outputs.affected_admin == 'true'
    uses: ./.github/workflows/deploy-app.yml
    with:
      app: admin-api
      environment: production
      health_port: 3000
    secrets: inherit

  deploy-core-api:
    needs: ci
    if: github.event_name == 'push' && needs.ci.outputs.affected_core == 'true'
    uses: ./.github/workflows/deploy-app.yml
    with:
      app: core-api
      environment: production
      health_port: 3000
    secrets: inherit

  deploy-batch:
    needs: ci
    if: github.event_name == 'push' && needs.ci.outputs.affected_batch == 'true'
    uses: ./.github/workflows/deploy-app.yml
    with:
      app: batch
      environment: production
      health_port: 3001
    secrets: inherit
